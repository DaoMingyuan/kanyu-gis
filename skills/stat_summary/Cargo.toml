[package]
name = "stat_summary"
description = "Kanyu analyzer skill (Rust guest): attribute statistics per group field (count/sum/min/max/avg)."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"
serde_json = "1"

# 独立小 crate（不属于上层 workspace）。
[workspace]

[profile.release]
opt-level = "s"
lto = true
