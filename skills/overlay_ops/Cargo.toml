[package]
name = "overlay_ops"
description = "Kanyu analyzer skill (Rust guest): overlay two layers (geo BooleanOps intersect/union/difference)."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"
serde_json = "1"
geo = "0.33"
geo-types = "0.7"
geojson = { version = "0.24", features = ["geo-types"] }

# 独立小 crate（不属于上层 workspace）。
[workspace]

[profile.release]
opt-level = "s"
lto = true
