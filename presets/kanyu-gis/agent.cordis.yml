# 堪舆 (Kanyu) GIS —— GIS 模式会话预设（kanyu-gis）。
#
# 定位：在 local-hybrid 本地混合模式之上的派生 preset，为「堪舆 GIS」仓库
# （E:\BaiduSyncdisk\堪舆GIS）注入领域专属能力。会话只加入一个 preset，
# 不继承其他 preset，故本文件自包含地复制 local-hybrid 的全部机制行，
# 差异点只有两个：(1) persona 追加堪舆 GIS 仓库守则层；(2) 自带
# `skills/kanyu-gis/SKILL.md` 领域技能（经 skill-filesystem 注入宿主
# skill 注册表，主模型按需经 skill 工具加载，不占常驻上下文）。
#
# 2026-08-18 重写（roster 实测驱动）：初版按宿主平面想象写了 model 路由行
# （type: openai-compat/deepseek）、file-operations/process/subagents 服务行、
# memory/system-prompt 特殊行与不存在的 dsh-tool-read/write/edit/glob/grep/
# read-image 包——web profile roster 实测判 broken（"row 1 names no plugin"）。
# 代理平面组合的合法形态以 local-hybrid 为准：
#   - 每一行必须是有 `name` 的插件行（或 cordis:group 组行）；model 路由、
#     fs/沙箱/审批、subagents 注册表、持久化全部属宿主平面，preset 不得声明；
#   - 文件读写 = dsh-tool-fs / dsh-tool-fs-search（不存在独立 read/write/edit
#     工具包）；shell = dsh-tool-pwsh（Windows）/ dsh-tool-bash（POSIX）；
#   - 子代理委派 = dsh-tool-subagent（provider: spawn + agentOptions 指定本地
#     Qwen3 8B），无需自注册 subagents 服务；
#   - 压缩 = dsh-compaction-basic 组；身份 = dsh-persona（遮蔽部署默认
#     persona，仅作用于加入本 preset 的会话）；
#   - 服务行必须坐在带 isolate realm 的组内（本文件不持有任何服务行）。
#
# 域知识（七域能力地图、联动机制、约定边界）不写进本文件，放在随 preset
# 目录分发的 `skills/kanyu-gis/SKILL.md`（单一事实来源：技能正文与
# kanyu introspect 输出同源，冲突时以 introspect 为准）。
#
# 本文件是唯一事实来源；preset.yml 只做发现元数据（name/description）。
# 改动本文件或技能后请运行 `node dsh/tools/verify_preset.mjs` 校验，
# 并以 web profile roster（agentPreset.list）的 broken 判定为最终实证。

# ── identity ────────────────────────────────────────────────────────────────

# 本 preset 自己的 persona，为加入它的会话遮蔽部署默认 persona。
# `{{model}}` 与 `{{cwd}}` 由 agent 自身路由与工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      语言要求：始终使用简体中文进行思考（thinking/reasoning）、回答、任务规划与拆解、todo 列表、计划文档、提交给子代理的任务描述（prompt）以及审查意见；子代理返回的内容若非中文，转述与采纳时改用中文。仅代码、命令、标识符、API 名称、错误信息等保持原文。
      本会话为本地混合模式：subagent 工具委派的子任务由本地 Qwen3 8B 高速辅助模型执行，适合摘要、检索、初稿、并行小任务；你负责规划、拆解、把关。子代理返回结果后必须由你亲自审查其正确性与完整性再采用；需要继承本对话上下文做审查或续作时使用 subagent_fork（它与你使用同一模型）。
      本会话为堪舆 GIS 模式：工作区是「堪舆 (Kanyu)」仓库（AI 原生地理空间操作系统，Rust workspace + dsh/ 组件源）。开工前必须先读仓库根 AI_SYNC.md 并登记开工，收工回记；遵守 AGENTS.md、docs/MASTERPLAN.md（总规裁决不得推翻）、docs/SECURITY.md。仓库守则要点：依赖方向（core 不依赖兄弟 crate）、内核零 C 依赖、无 execute_code、单一事实来源（kanyu introspect）、UI 组件铁律（ui_kit 优先）、提交用 Conventional Commits。
      本 preset 自带 kanyu-gis 领域技能：用 skill 工具加载「kanyu-gis」获取七域能力地图（地图渲染 / 数据读取 / 坐标系 / 工程目录 / 地理处理 / 图层编辑 / 3D 场景 + MCP 服务器）与 AI 工作流细则；勘察与验证驱动 kanyu CLI（kanyu introspect / kanyu agents validate / cargo build、test、clippy、fmt）。
      You can read and modify the harness you run on. Its composition is Cordis: every capability is a plugin row in a `cordis.yml`, and an agent preset is one such file mounted for a single session. Two planes decide where an edit belongs. The HOST composition holds the registries and anything shared across sessions — persistence, the sandbox and approval stack, the model route, the subagent registry and its backends. An AGENT PRESET holds what one session contributes to those registries: its tools, its persona, its prompt sections. A row that publishes a service belongs in the host composition, or inside an `isolate` realm if the preset genuinely owns that service and nothing outside one agent reads it.
      Presets you author live one directory per preset under `${DSH_HOME:-$HOME/.dsh}/.agent-presets/<id>/`; the roster reports each preset's real path, so take the one you edit from there. NEVER edit or delete the shipped preset install: it belongs to the deployment, an upgrade overwrites it. To change what a shipped preset does, copy its composition into a new preset directory and edit the copy. Load the `editing-cordis-compositions` skill before writing or changing a composition.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# shell-env 留在宿主组合（apps/cli/src/web.ts 注入 DSH_WEB_URL/DSH_WEB_MODE）；
# 两个 shell 工具从宿主注册表解析，执行器（bash-sandbox/pwsh-sandbox）也在
# 宿主平面。Windows 上 pwsh 生效、bash 行按平台禁用（反之亦然）。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    maxOutputChars: 200000

# ── filesystem ──────────────────────────────────────────────────────────────

# 两者注册进宿主 tools 注册表、自身不提供任何服务，无需 realm。
# fs 服务与其策略留在宿主平面。（本部署不存在独立的 read/write/edit/glob/grep
# 工具包——文件读写走 dsh-tool-fs，检索走 dsh-tool-fs-search。）
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# 只有面向模型的控制行；任务注册表留在宿主平面（按 owning agent 键控，
# 一个宿主实例服务所有会话）。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# skill 注册表在宿主组合、按 scope 分层：这两行注册进本 preset 自己的层。
# skill-filesystem 贡献本地根发现（本 preset 自带 skills/ 目录），tool-skill
# 给 agent 目录与加载器；合并目录同时携带部署全局注册的技能。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    # 加载本 preset 自带 skills/ 目录（含 kanyu-gis 领域技能）；preset 拷贝
    # 安装后随目录走，baseUrl 即本组合文件自身的 URL。
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── MCP 桥（堪舆内核 AI 意图面整合） ─────────────────────────────────────────

# kanyu-mcp（crates/kanyu-mcp，17 stable 工具）经 dsh-mcp-client 桥接入会话：
# 模型可见 mcp__kanyu__* 工具（server 限定名，与组件 8 个 kanyu_* 动态工具
# 互补——动态工具走 PATH 上的 kanyu CLI，MCP 桥走 stdio 长驻子进程）。
# 每会话一个插件实例；failOnStartupError 默认 false，kanyu.exe 不在 PATH 时
# 会话仍可加载（工具缺席但不 broken）。
- id: mcp-kanyu
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: kanyu
    transport: stdio
    command: kanyu
    args: ['mcp', 'serve']

# ── goals ───────────────────────────────────────────────────────────────────

# 只有面向模型的工具行；goal 服务、会话驱动与 /goal 命令留在宿主平面
# （注册表按会话键控，一个宿主实例服务所有会话）。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# 计划状态按 agent 键控，entry-local realm 在此是正确生命周期而非变通。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# compaction-basic 经 ctx.get 读 toolResultPrune，故剪枝器必须与本组共享
# realm；tokenMeter 有意不进此 realm（留在宿主平面）。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        # 上下文用量达到当前模型窗口的 70% 时自动压缩
        thresholdRatio: 0.7
        # 压缩后保留最近 16% 窗口的原文上下文
        retainRatio: 0.16
        # 摘要生成上限
        maxTokens: 8192
        # 压缩后仍超阈值时追加一轮压缩；溢出后再兜底恢复一次
        compactionRetries: 1
        maxOverflowRetries: 1
        auto: true
        # 按模型的精确策略：27B 主模型档的待压缩内容摘要交给本地 8B 辅助
        # 模型（115 tok/s），压缩几乎无感
        modelPolicies:
          - provider: ollama
            model: qwen3.8:27b-gpu
            summarizationProvider: ollama
            summarizationModel: qwen3:8b-dsh
            maxTokens: 8192

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# subagents 注册表与其 spawn/fork 后端在宿主组合（进程单例）；本 preset
# 只贡献委派工具，经宿主注册表解析。workflows 没有组外读者，故整组共享
# 一个 entry-local realm。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        # 本地混合模式核心：subagent 子代理固定路由到本地 Qwen3 8B 高速辅助
        # 模型，主模型（27B 或 DeepSeek）专注规划与审查；subagent_fork 不设
        # 此项，仍继承主会话模型。
        agentOptions:
          provider: ollama
          model: qwen3:8b-dsh
          maxTokens: 16384

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 产品级 provider 是宿主平面单例；本 preset 不暴露 codex/claude-code
    # 通道（复制本 preset 后去掉 disabled 即可只对派生会话开放）。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# web 服务与搜索 provider 留在宿主组合；只有面向模型的工具是按会话的。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── self-modification（创造模式） ────────────────────────────────────────────

# tool-cordis 的 inspect provider 是全进程单例，两个 preset 同时携带会互相
# 冲突（后者挂载失败）。当前部署已挂载官方 cordis preset 副本（承载
# inspect/define/run 等运行时工具），本 preset 因此不携带 tool-cordis 行；
# cordis 工具一律经作用域父级解析官方 preset 的既有进程单例。

# 维护者注：
#   - 初版（2026-08-16/17）的 model 三行（model-local/model-local-8b/
#     model-deepseek）已删除：模型路由是宿主平面职责，会话模型在 web UI
#     选模型处或部署默认路由决定；本地端点（11434 / 1031614 / 15724）经
#     宿主 model 注册表生效，preset 不可声明。
#   - 初版的 file-operations（dsh-file-operations）与 process（dsh-process）
#     服务行已删除：本部署无此二包，文件与进程服务是宿主平面既有物。
#   - 初版的 memory/system-prompt 特殊行已删除：代理平面无此行型，身份
#     走 persona 行、压缩走 compaction 组（上方）。
#   - 初版的 skill-kanyu-gis 行（name: kanyu-gis）已删除：技能经
#     skill-filesystem 的 customSkillDirs 发现注入，无需（也不存在）
#     按技能名命名的插件行。
